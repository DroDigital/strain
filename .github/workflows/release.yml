name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist/strain
          cp target/release/strain README.md dist/strain/
          tar -C dist -czf strain-linux-x86_64.tar.gz strain
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: strain-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/strain | Out-Null
          Copy-Item target/release/strain.exe, README.md dist/strain/
          Compress-Archive -Path dist/strain -DestinationPath strain-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: strain-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Universal app bundle
        run: |
          APP=dist/Strain.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/strain" \
            target/aarch64-apple-darwin/release/strain \
            target/x86_64-apple-darwin/release/strain
          lipo -info "$APP/Contents/MacOS/strain"
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/__VERSION__/${VERSION:-0.1.0}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" strain-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: strain-macos-universal.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "STRAIN $GITHUB_REF_NAME" --generate-notes
